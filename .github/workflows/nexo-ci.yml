name: nexo-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['nexo/**', '.github/workflows/nexo-ci.yml']
  push:
    branches: [main]
    paths: ['nexo/**', '.github/workflows/nexo-ci.yml']

concurrency:
  group: nexo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nexo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: nexo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
